name: Aspace Dev Auto-Merge (Prod Isolated)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  dev-fast-merge:
    # Auto-merge actif uniquement sur les branches de développement (allowlist stricte dev/* ; main/master/prod/forks exclus)
    if: startsWith(github.base_ref, 'dev/') && !github.event.pull_request.head.repo.fork && github.head_ref != 'main' && github.head_ref != 'master' && !startsWith(github.head_ref, 'prod')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies & run CPU checks
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd launcher
          bun run typecheck
          bun run --cwd launcher typecheck
          bun test ./tests/aspace-palier-orchestrator.test.ts
          node --test launcher/tests/local-chrome-cdp.test.cjs launcher/tests/renderer-wiring.test.cjs

      - name: Enable GitHub Dev Auto-Merge (Squash)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash

      - name: Notify Google Chat Space LD08 on Dev Merge (if configured)
        if: always()
        env:
          GCHAT_LD08_WEBHOOK_URL: ${{ secrets.GCHAT_LD08_WEBHOOK_URL }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$GCHAT_LD08_WEBHOOK_URL" ]; then
            echo "GCHAT_LD08_WEBHOOK_URL secret not configured; skipping webhook."
            exit 0
          fi
          PAYLOAD=$(jq -n --arg msg "[person/delivery] Dev Auto-Merge (${JOB_STATUS}) : ${HEAD_REF} -> ${BASE_REF} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER})" '{text: $msg}')
          curl -fsSL -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$GCHAT_LD08_WEBHOOK_URL"
